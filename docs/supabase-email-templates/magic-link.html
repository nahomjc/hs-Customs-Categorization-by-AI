<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to Impact Logistics</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
          <tr>
            <td style="padding-bottom:24px;text-align:center;">
              <a href="{{ .SiteURL }}" style="text-decoration:none;">
                <p style="margin:0;font-size:26px;font-weight:700;letter-spacing:0.14em;color:#111827;">IMPACT</p>
                <p style="margin:6px 0 0;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#6b7280;">Logistics</p>
              </a>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 24px rgba(15,23,42,0.06);">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr><td style="height:4px;background-color:#007bff;font-size:0;">&nbsp;</td></tr>
                <tr>
                  <td style="padding:40px 32px 32px;">
                    <p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#007bff;">Secure sign-in</p>
                    <h1 style="margin:0 0 16px;font-size:24px;font-weight:700;color:#111827;">Your sign-in link</h1>
                    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#4b5563;">
                      Click below to sign in to Impact Logistics as <strong style="color:#111827;">{{ .Email }}</strong>.
                    </p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td align="center" style="padding:8px 0 24px;">
                          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#007bff;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:8px;">Sign in</a>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:0;font-size:13px;line-height:1.55;color:#6b7280;">
                      If you did not request this link, you can ignore this email.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
